[project]
name = "optix"
version = "0.1.0"
description = "Toy LP solver for learning optimization from scratch."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "polars>=1.44.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optix"]
